<div class="container">
  <h1>📧 Contact Us</h1>
  <div class="contact-card">
    <p>This is a simple static route demonstrating basic routing configuration.</p>
    <form (ngSubmit)="onSubmit()" class="contact-form">
      <div class="form-group">
        <label>Name:</label>
        <input type="text" [(ngModel)]="name" name="name" required class="form-control" />
      </div>
      <div class="form-group">
        <label>Email:</label>
        <input type="email" [(ngModel)]="email" name="email" required class="form-control" />
      </div>
      <div class="form-group">
        <label>Message:</label>
        <textarea [(ngModel)]="message" name="message" rows="5" class="form-control"></textarea>
      </div>
      <button type="submit" class="btn">Send Message</button>
    </form>
  </div>
</div>
